name: Almentor
description: 'Almentor is a Dubai (UAE) based video e-learning platform delivering the largest high-quality
  Arabic continuous-learning video library, founded in 2016 and launched in January 2018 by Ihab Fikry
  and Ibrahim Kamel. It serves both individual learners (B2C) and organizations (B2B via business.almentor.net)
  with paid courses, free talks, crash courses, and books across health, humanities, technology, entrepreneurship,
  business management, lifestyle, and corporate communication, delivered by hundreds of experts and educators
  across the MENA region. Backed by Partech, Almentor has delivered more than three million learning experiences.
  Almentor publishes no public developer/API program; this profile is maintained as a company record in the
  API Evangelist network.'
